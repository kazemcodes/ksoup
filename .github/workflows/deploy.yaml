name: publish

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        buildType:
          - "core"
          - "io"
          - "kotlinx"
          - "korlibs"
          - "okio"
          - "ktor2"
    runs-on: macos-latest
    name: Publish ${{ matrix.buildType }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup GPG for signing
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          
          # Write signing properties to gradle.properties
          echo "signingInMemoryKeyId=${GPG_KEY_ID}" >> ~/.gradle/gradle.properties
          echo "signingInMemoryKeyPassword=${GPG_KEY_PASSWORD}" >> ~/.gradle/gradle.properties
          
          # Write the key - preserve newlines by using printf
          printf 'signingInMemoryKey=%s\n' "${GPG_SIGNING_KEY//$'\n'/\\n}" >> ~/.gradle/gradle.properties
          
          echo "Gradle properties configured"

      - name: Publish ${{ matrix.buildType }}
        run: |
          chmod +x ./publishToMaven.sh
          ./publishToMaven.sh --remote ${{ matrix.buildType }}
        working-directory: ${{ github.workspace }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.gradle/gradle.properties

      - name: Success message
        run: echo "Publishing of ${{ matrix.buildType }} completed successfully."

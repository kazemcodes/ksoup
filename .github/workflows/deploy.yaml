name: publish

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        buildType:
          - "core"
          - "io"
          - "kotlinx"
          - "korlibs"
          - "okio"
          - "ktor2"
    runs-on: macos-latest
    name: Publish ${{ matrix.buildType }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode GPG Key
        run: |
          echo "${{ secrets.GPG_KEY }}" | base64 --decode > /tmp/secring.gpg
          echo "GPG_KEY_FILE=/tmp/secring.gpg" >> $GITHUB_ENV

      - name: Publish ${{ matrix.buildType }}
        run: |
          chmod +x ./publishToMaven.sh
          ./publishToMaven.sh --remote ${{ matrix.buildType }}
        working-directory: ${{ github.workspace }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.keyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.secretKeyRingFile: /tmp/secring.gpg

      - name: Cleanup
        if: always()
        run: rm -f /tmp/secring.gpg

      - name: Success message
        run: echo "Publishing of ${{ matrix.buildType }} completed successfully."

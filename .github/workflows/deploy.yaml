name: publish

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        buildType:
          - "core"
          - "io"
          - "kotlinx"
          - "korlibs"
          - "okio"
          - "ktor2"
    runs-on: macos-latest
    name: Publish ${{ matrix.buildType }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup GPG for signing
        run: |
          mkdir -p ~/.gradle
          echo "signing.keyId=${{ secrets.GPG_KEY_ID }}" >> ~/.gradle/gradle.properties
          echo "signing.password=${{ secrets.GPG_KEY_PASSWORD }}" >> ~/.gradle/gradle.properties
          # Write multi-line key using heredoc
          cat >> ~/.gradle/gradle.properties << 'ENDOFKEY'
          signing.key=${{ secrets.GPG_SIGNING_KEY }}
          ENDOFKEY
          echo "Gradle properties configured"

      - name: Debug signing config
        run: |
          echo "Checking gradle.properties..."
          grep -c "signing" ~/.gradle/gradle.properties || echo "No signing props found"

      - name: Publish ${{ matrix.buildType }}
        run: |
          chmod +x ./publishToMaven.sh
          ./publishToMaven.sh --remote ${{ matrix.buildType }}
        working-directory: ${{ github.workspace }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.gradle/gradle.properties

      - name: Success message
        run: echo "Publishing of ${{ matrix.buildType }} completed successfully."
